communication:
  title: Communication
  excerpt: In our childhood, we learn that the whom who speaks the louder wins. But then in Life, we hit wall after wall and we don't get through. Until we finally learn that the art of communication is mostly about listening and learning about other's people motivations, dreams, and aspirations. In this collection, I share the stuff that I'm learning, and the mistakes I make.
  image: https://images.unsplash.com/photo-1453738773917-9c3eff1db985?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxMTc3M3wwfDF8c2VhcmNofDV8fGNvbW11bmljYXRpb258ZW58MHx8fHwxNjM2MTkwMzM5&ixlib=rb-1.2.1&q=80&w=2000

